<meta charset="utf-8">
<title>Song Recommender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centred column. Search on top, five result rows, then a "how it works" panel. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#161b26; --muted:#5b6475; --line:#dde2ea;
  --accent:#0f766e; --accent-soft:#d9f0ed; --accent-fg:#ffffff; --bar:#c9d3df;
  --font-head:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#181e29; --fg:#e8ecf3; --muted:#96a0b3; --line:#2a3342;
  --accent:#4fd1c5; --accent-soft:#16363a; --accent-fg:#06201e; --bar:#2c3647; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#181e29; --fg:#e8ecf3; --muted:#96a0b3; --line:#2a3342;
  --accent:#4fd1c5; --accent-soft:#16363a; --accent-fg:#06201e; --bar:#2c3647; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--font-head);font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
h2{font-family:var(--font-head);font-size:18px;margin:0 0 12px}
.lead{color:var(--muted);margin:0;max-width:60ch}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 280px;min-width:0;padding:12px 14px;font:inherit;color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:hover{filter:brightness(1.06)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mix{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mix .row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.mix select{font:inherit;min-width:0;padding:8px 10px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.mix output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:480px){.mix .row{grid-template-columns:1fr 44px}.mix .row label{grid-column:1 / 3}}
.mix input[type=range]{width:100%;accent-color:var(--accent)}
.chip.emo{background:var(--accent);color:var(--accent-fg)}
.picked{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.picked b{font-family:var(--font-head);font-size:18px}
.meta{color:var(--muted);font-size:13px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li.rec{display:grid;grid-template-columns:28px 1fr 84px;gap:6px 14px;align-items:center;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px}
.rank{font-family:var(--font-head);font-weight:700;color:var(--accent);font-size:20px}
.rec .t{font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--fg)}
.score{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--bar);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.why{grid-column:2 / 4;font-size:13px;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
summary{cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:16px}
.steps{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.step b{display:block}
code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--bg);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}
@media (max-width:480px){li.rec{grid-template-columns:24px 1fr}.score{grid-column:2;text-align:left;display:flex;gap:10px;align-items:center}.bar{flex:1;margin:0}.why{grid-column:2}}
</style>

<main>
  <header>
    <h1>Song Recommender</h1>
    <p class="lead">Pick a song you like. It suggests 5 similar songs from a library of <span id="count"></span> songs, by comparing artist, genre, mood and language.</p>
  </header>

  <form class="search" id="form">
    <input id="q" list="songs" autocomplete="off" placeholder="Type a song name, then pick it from the list" aria-label="Song name">
    <datalist id="songs"></datalist>
    <button class="primary" type="submit">Recommend</button>
    <button type="button" id="rand">Surprise me</button>
  </form>

  <div class="mix">
    <b>How much should each factor count?</b>
    <div class="row"><label for="w_tags">Artist, genre, tags</label><input type="range" id="w_tags" min="0" max="100" step="10" value="40"><output id="o_tags"></output></div>
    <div class="row"><label for="w_emotion">Emotion</label><input type="range" id="w_emotion" min="0" max="100" step="10" value="30"><output id="o_emotion"></output></div>
    <div class="row"><label for="w_context">Lyric theme, occasion</label><input type="range" id="w_context" min="0" max="100" step="10" value="20"><output id="o_context"></output></div>
    <div class="row"><label for="w_era">Release year</label><input type="range" id="w_era" min="0" max="100" step="10" value="10"><output id="o_era"></output></div>
    <div class="row"><label for="variety">Artist variety</label><select id="variety"><option value="mix">Mix: 1 song per artist</option><option value="strict">Strict: not the artist I picked</option><option value="off">Off: same artist allowed</option></select><span></span></div>
  </div>

  <section id="out" aria-live="polite"></section>

  <details>
    <summary>How this works, step by step</summary>
    <div class="steps" id="how"></div>
  </details>
</main>

<script>
const DATA = /*DATA*/null; // each song: [title, artists, genre, tags line, language, main emotion, second emotion, year, lyric theme, occasions]

// ---- Step 3: vocabulary and vectors (same as CountVectorizer) ----
const MAX_FEATURES = 5000;
const wordsOf = i => DATA[i][3].split(" ").filter(Boolean);
const totals = {};
DATA.forEach((_, i) => wordsOf(i).forEach(w => totals[w] = (totals[w] || 0) + 1));
const vocab = Object.keys(totals).sort((a, b) => totals[b] - totals[a] || a.localeCompare(b)).slice(0, MAX_FEATURES);
const col = new Map(vocab.map((w, i) => [w, i]));
const vec = DATA.map((_, i) => { const m = new Map(); wordsOf(i).forEach(w => { if (col.has(w)) m.set(col.get(w), (m.get(col.get(w)) || 0) + 1); }); return m; });
const norm = vec.map(m => Math.sqrt([...m.values()].reduce((s, n) => s + n * n, 0)));

// ---- Step 4: cosine similarity between two songs ----
function cosine(a, b) {
  let dot = 0;
  for (const [c, n] of vec[a]) { const o = vec[b].get(c); if (o) dot += n * o; }
  return dot / (norm[a] * norm[b]);
}

// ---- Step 6: emotion. Each emotion is a point: [how positive, how intense], both 0 to 1 ----
const MAP = {
  heartbreak: [0.10, 0.35], sad: [0.15, 0.20], nostalgic: [0.40, 0.30], mellow: [0.55, 0.10],
  romantic: [0.75, 0.35], happy: [0.85, 0.65], euphoric: [0.90, 0.95], confident: [0.70, 0.85],
  angry: [0.10, 0.90], intense: [0.20, 0.75], spiritual: [0.65, 0.15],
};
// a song's point = 70% main emotion + 30% second emotion
const point = DATA.map(s => { const p = MAP[s[5]], q = MAP[s[6]] || p; return [0.7 * p[0] + 0.3 * q[0], 0.7 * p[1] + 0.3 * q[1]]; });
// 1 = same feeling, 0 = opposite feelings
const emotionSim = (a, b) => 1 - Math.hypot(point[a][0] - point[b][0], point[a][1] - point[b][1]) / Math.SQRT2;

// ---- Step 7: lyric theme, occasion and release year ----
// some themes are close cousins, so they get partial credit
const RELATED = { "love|heartbreak": 0.4, "heartbreak|nostalgia": 0.4, "nostalgia|reflection": 0.5, "reflection|struggle": 0.4,
  "struggle|rebellion": 0.4, "ambition|party": 0.3, "party|freedom": 0.4, "devotion|reflection": 0.3 };
const themeSim = (a, b) => a === b ? 1 : (RELATED[a + "|" + b] || RELATED[b + "|" + a] || 0);
// occasions: shared / total different
function occasionSim(a, b) {
  const A = new Set(DATA[a][9]), B = new Set(DATA[b][9]);
  const shared = [...A].filter(x => B.has(x)).length;
  return shared / (A.size + B.size - shared);
}
const contextSim = (a, b) => 0.5 * themeSim(DATA[a][8], DATA[b][8]) + 0.5 * occasionSim(a, b);
// era: 1 for the same year, falling to 0 at 25 or more years apart
const eraSim = (a, b) => Math.max(0, 1 - Math.abs(DATA[a][7] - DATA[b][7]) / 25);

// ---- Step 5 + 7: recommend. wt = how much each factor counts (they do not need to add up to 100) ----
const artistsOf = i => DATA[i][1].split(", ").map(a => a.toLowerCase());
function recommend(i, wt, variety = "mix", count = 5) {
  const total = (wt.tags + wt.emotion + wt.context + wt.era) || 1;
  const ranked = DATA.map((_, j) => {
    const p = { tags: cosine(i, j), emotion: emotionSim(i, j), context: contextSim(i, j), era: eraSim(i, j) };
    return { j, p, score: (wt.tags * p.tags + wt.emotion * p.emotion + wt.context * p.context + wt.era * p.era) / total };
  }).filter(x => x.j !== i).sort((a, b) => b.score - a.score);
  if (variety === "off") return ranked.slice(0, count);
  // variety: walk down the ranking and skip a song if any of its artists already appears in the list.
  // "strict" also blocks the artists of the song you picked.
  const used = new Set(variety === "strict" ? artistsOf(i) : []);
  const out = [];
  for (const x of ranked) {
    const a = artistsOf(x.j);
    if (a.some(n => used.has(n))) continue;
    a.forEach(n => used.add(n));
    out.push(x);
    if (out.length === count) break;
  }
  return out;
}

// ---- Page ----
const $ = id => document.getElementById(id);
const labels = DATA.map((s, i) => s[0] + " — " + s[1].split(", ").slice(0, 2).join(", "));
const seenLabel = new Map();
labels.forEach((l, i) => { if (seenLabel.has(l)) labels[i] = l + " (" + s2(i) + ")"; seenLabel.set(labels[i], i); });
function s2(i) { return DATA[i][2]; }
const byLabel = new Map(labels.map((l, i) => [l.toLowerCase(), i]));
$("count").textContent = DATA.length.toLocaleString();
$("songs").append(...labels.map(l => Object.assign(document.createElement("option"), { value: l })));

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function chips(parts) { const d = el("div", "chips"); parts.filter(Boolean).forEach(p => d.append(el("span", "chip", p))); return d; }

function findSong(text) {
  const t = text.trim().toLowerCase();
  if (!t) return -1;
  if (byLabel.has(t)) return byLabel.get(t);
  let i = DATA.findIndex(s => s[0].toLowerCase() === t);
  if (i < 0) i = DATA.findIndex(s => s[0].toLowerCase().startsWith(t));
  if (i < 0) i = DATA.findIndex(s => s[0].toLowerCase().includes(t));
  return i;
}

let current = 0;
const FACTORS = ["tags", "emotion", "context", "era"];
function weights() { const o = {}; FACTORS.forEach(f => { o[f] = Number($("w_" + f).value); $("o_" + f).textContent = o[f]; }); return o; }
// emotion chips (accent colour), lyric theme, and where the song is played
function emoChips(s) { const d = chips([s[5], s[6], "about " + s[8], ...s[9].map(o => "at " + o)]); d.firstChild.classList.add("emo"); return d; }

function show(i) {
  current = i;
  const wt = weights();
  const out = $("out"); out.replaceChildren();
  const me = DATA[i];
  const picked = el("div", "picked");
  picked.append(el("div", "meta", "Because you like"), el("b", null, me[0]), el("div", "meta", me[1] + " · " + me[7]), chips([me[2], me[4]]), el("div", "meta", "Feels like, is about, and is played at:"), emoChips(me));
  const list = el("ol");
  const mine = new Set(wordsOf(i));
  recommend(i, wt, $("variety").value).forEach((r, n) => {
    const s = DATA[r.j], li = el("li", "rec");
    li.append(el("div", "rank", String(n + 1)));
    const body = el("div"); body.append(el("div", "t", s[0]), el("div", "meta", s[1] + " · " + s[7]), chips([s[2], s[4]]), emoChips(s));
    const sc = el("div", "score"); sc.append(el("span", null, Math.round(r.score * 100) + "% match"));
    const bar = el("div", "bar"), fill = el("i"); fill.style.width = Math.round(r.score * 100) + "%"; bar.append(fill); sc.append(bar);
    const shared = wordsOf(r.j).filter(w => mine.has(w));
    li.append(body, sc, el("div", "why", "Tags " + Math.round(r.p.tags * 100) + "% · emotion " + Math.round(r.p.emotion * 100) + "% · theme and occasion " + Math.round(r.p.context * 100) + "% · year " + Math.round(r.p.era * 100) + "%. Shared words: " + (shared.join(", ") || "none")));
    list.append(li);
  });
  out.append(picked, el("h2", null, "5 songs you may like"), list);
  explain(i);
  $("q").value = labels[i];
}

function explain(i) {
  const how = $("how"); how.replaceChildren();
  const add = (title, body, code) => { const d = el("div", "step"); d.append(el("b", null, title)); d.append(el("span", null, body)); if (code) { d.append(document.createElement("br"), el("code", null, code)); } how.append(d); };
  const nz = [...vec[i].keys()].map(c => vocab[c]);
  add("1. Describe the song as text", "Genre, artists, mood tags, language and album are joined into one line, lowercase, with spaces removed inside names so \"Arijit Singh\" becomes one word.", DATA[i][3]);
  add("2. Turn the text into numbers", "Every song becomes a row of " + vocab.length.toLocaleString() + " counts, one per word in the vocabulary. This song has " + nz.length + " non-zero counts; the rest are 0.", nz.join(" = 1, ") + " = 1");
  add("3. Compare two songs", "Cosine similarity multiplies the two rows, adds it up, and divides by their lengths. It gives 0 for nothing in common and 1 for identical.");
  const pt = point[i].map(n => n.toFixed(2));
  add("4. Add the emotion", "Each song has a main and a second emotion. Each emotion is a point on a map: how positive it feels and how intense it feels. This song sits at " + pt[0] + " positive, " + pt[1] + " intense. Songs whose points are close feel alike, so sad is near nostalgic and far from euphoric. The emotions were labelled by an AI from what it knows of each song, so some are guesses.");
  add("5. Add theme, occasion and year", "Each song also has a lyric theme (what the words are about), the occasions it is played at (party, workout, long drive...), and a release year. Same theme and shared occasions raise the score, and so do songs released in the same era (25 or more years apart counts as 0). These labels were written by an AI from what it knows of each song, without copying lyrics, so some are guesses. For classical pieces the year is when it was composed.");
  add("6. Recommend", "Final score = each factor's match multiplied by its slider, added up, and divided by the total of the sliders. Score the picked song against all " + DATA.length.toLocaleString() + " songs, skip itself, and show the 5 highest. Artist variety then walks down that list and skips any song whose artist is already in your 5, so one artist cannot fill the list.");
}

$("form").addEventListener("submit", e => { e.preventDefault(); const i = findSong($("q").value); if (i < 0) { $("out").replaceChildren(el("p", "lead", "No song found. Try another name, or pick one from the list.")); return; } show(i); });
FACTORS.forEach(f => $("w_" + f).addEventListener("input", () => show(current)));
$("variety").addEventListener("change", () => show(current));
$("rand").addEventListener("click", () => show(Math.floor(Math.random() * DATA.length)));
$("q").addEventListener("change", () => { const i = byLabel.get($("q").value.trim().toLowerCase()); if (i != null) show(i); });
show(Math.max(0, DATA.findIndex(s => s[0] === "Khairiyat")));
</script>
