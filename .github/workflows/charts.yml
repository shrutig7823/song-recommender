# Keeps "Popular right now" fresh: every day, fetch the latest country charts and commit charts.json.
name: Update charts
on:
  schedule:
    - cron: "17 3 * * *"        # every day at 03:17 UTC
  workflow_dispatch: {}          # also lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch_charts.js
      - name: Commit if the charts changed
        run: |
          git config user.name "moodio-bot"
          git config user.email "moodio-bot@users.noreply.github.com"
          git add charts.json
          git diff --cached --quiet || (git commit -m "Update charts" && git push)
